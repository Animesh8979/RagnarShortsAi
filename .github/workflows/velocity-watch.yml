# Phase 3 — velocity-spike watch on the self-hosted runner.
#
# Polls 5 trend sources every 10 minutes. On a 2x mention-velocity spike
# across ≥3 sources, emits a priority-trigger-*.json which the
# (long-running) priority-watcher process consumes and fires
# lib/priority-batch.js → 15-min spike-to-publish.
#
# This workflow ONLY samples + detects + emits. It does NOT render or
# upload directly — the watcher does that, so the GH Actions slot stays
# short (most ticks finish in <30s).

name: Velocity Watch
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min UTC
  workflow_dispatch:

jobs:
  velocity-watch:
    runs-on: [self-hosted, windows]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: D:\anitgravity work
        shell: bash
    steps:
      - name: One-shot velocity sample + detect + emit
        run: node lib/velocity-watch.js --once --emit

      - name: Upload velocity ledger artifact (weekly digest)
        if: github.event.schedule == '0 0 * * 0'
        uses: actions/upload-artifact@v4
        with:
          name: topic-velocity-weekly-${{ github.run_id }}
          path: D:\anitgravity work\renders\analytics\topic-velocity.jsonl
          retention-days: 30
